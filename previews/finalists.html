        &#x27;“Three years running closing shifts. Trained five new folks. Weekends work for me; Tuesday nights don’t. My CPR card’s current.”&#x27;,

      toggle.addEventListener(&#x27;click&#x27;, () =&gt; {
        alternate = !alternate;
        toggle.setAttribute(&#x27;aria-pressed&#x27;, String(alternate));
        quote.textContent = statements[Number(alternate)];

        confirm.disabled = true;
        confirm.textContent = &#x27;Confirm source meaning&#x27;;
      });

        proof.hidden = !proof.hidden;

      });

        root.querySelector(&#x27;.sw-claim&#x27;).textContent = &#x27;Unavailable Tuesday evenings.&#x27;;
